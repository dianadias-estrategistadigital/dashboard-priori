<title>Painel Priori Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#F5F2EE;--card:#FFFFFF;--fg:#2B2A1E;--muted:#6E6A5F;--line:#E4DDD5;--olive:#71702F;--rose:#AC8878;--err:#9A3B2E;
  --display:"Montserrat",system-ui,sans-serif;--body:"Nunito Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#181814;--card:#21211B;--fg:#EDEBE3;--muted:#A9A696;--line:#36352C;--olive:#C1BE78;--rose:#D8AEA3;--err:#E79A8C;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:linear-gradient(115deg,#71702F 0%,#7F7A3E 30%,#A2896F 68%,#CFB1B8 100%);color:var(--fg);font-family:var(--body);display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:380px;background:var(--card);border:0;box-shadow:0 20px 50px rgba(40,38,20,.25);border-radius:18px;padding:32px 28px;display:flex;flex-direction:column;gap:18px}
.logo{width:52px;height:52px;color:var(--olive)}
small{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--rose)}
h1{font-family:var(--display);font-size:22px;font-weight:800;margin:4px 0 0}
p{margin:0;font-size:14px;color:var(--muted)}
form{display:flex;flex-direction:column;gap:12px}
label{font-family:var(--display);font-size:12px;font-weight:700}
input[type=password]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
input:focus-visible,button:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
.remember{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);font-family:var(--body);font-weight:400}
.remember input{accent-color:var(--olive);width:16px;height:16px}
button{font-family:var(--display);font-weight:700;font-size:14px;padding:12px;border:0;border-radius:99px;background:var(--olive);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--err);font-size:13px;min-height:1.2em}
.foot{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
</style>
</head>

var KEY='priori-painel-k';
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function hex(buf){return btoa(String.fromCharCode.apply(null,new Uint8Array(buf)))}
async function deriveRaw(pw){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(P.salt),iterations:P.iter,hash:'SHA-256'},base,256);
}
function render(html){
  // Troca cabeça e corpo da página pelos do painel, sem herdar nada da tela de senha.
  var d=new DOMParser().parseFromString(html,'text/html');
  var root=document.documentElement;
  root.replaceChild(document.importNode(d.head,true),document.head);
  root.replaceChild(document.importNode(d.body,true),document.body);
  [].slice.call(document.body.querySelectorAll('script')).forEach(function(old){
    var s=document.createElement('script'); s.textContent=old.textContent; old.parentNode.replaceChild(s,old);
  });
  window.scrollTo(0,0);
}
async function openWith(raw){
  var key=await crypto.subtle.importKey('raw',raw,'AES-CBC',false,['decrypt']);
  var out=await crypto.subtle.decrypt({name:'AES-CBC',iv:b64(P.iv)},key,b64(P.ct));
  var txt=new TextDecoder().decode(out);
  if(txt.indexOf('PRIORI-OK:')!==0) throw new Error('bad');
  window.__prioriKey=raw;
  render(txt.slice(10));
}
(async function(){
  try{var saved=localStorage.getItem(KEY); if(saved){await openWith(b64(saved));return}}catch(e){try{localStorage.removeItem(KEY)}catch(_){}}
})();
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();
  var btn=document.getElementById('go'),err=document.getElementById('err');
  if(!window.crypto||!crypto.subtle){err.textContent='Abra o painel pelo endereço oficial (https).';return}
  btn.disabled=true;btn.textContent='Verificando…';err.textContent='';
  try{
    var raw=await deriveRaw(document.getElementById('pw').value.trim());
    if(document.getElementById('rem').checked){try{localStorage.setItem(KEY,hex(raw))}catch(_){}}
    await openWith(raw);
  }catch(x){
    err.textContent='Senha incorreta. Confira e tente de novo.';
    btn.disabled=false;btn.textContent='Entrar';
  }
});
</script>
